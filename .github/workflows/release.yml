# =============================================================================
# Release Workflow - GitHub Actions Pipeline for NestJS Hello World Application
# =============================================================================
#
# This workflow is triggered when a new release is created on GitHub. It performs
# the following operations:
#
# 1. build-and-push: Builds a Docker image and pushes it to GitHub Container Registry
# 2. create-release-artifacts: Creates distributable archives with compiled TypeScript
# 3. verify-deployment: Validates that the Docker image works correctly
#
# NestJS Migration Notes:
# - TypeScript compilation (npm run build) is required before testing and archiving
# - Test script changed from test:coverage to test:cov (NestJS standard naming)
# - Production deployments use npm run start:prod (runs compiled dist/main.js)
# - Archive excludes *.tsbuildinfo files generated by TypeScript compiler
#
# @author Blitzy Platform
# @version 2.0.0 (NestJS migration)
# =============================================================================

name: Release

# Trigger: Workflow runs when a new GitHub release is created
on:
  release:
    types: [created]

# Global environment variables used across all jobs
env:
  # Docker image name following GitHub Container Registry naming convention
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nodejs-hello-world
# =============================================================================
# JOBS DEFINITION
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Job: build-and-push
  # Purpose: Build Docker image and push to GitHub Container Registry
  # Notes: The multi-stage Dockerfile handles TypeScript compilation internally,
  #        so no separate build step is needed here
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Configure Docker Buildx for advanced build features (caching, multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Authenticate with GitHub Container Registry using GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract Docker metadata for proper tagging (semver-based tags + latest)
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags:
            # Tag with full version number (e.g., 1.2.3)
            - type=semver,pattern={{version}}
            # Tag with major.minor version (e.g., 1.2)
            - type=semver,pattern={{major}}.{{minor}}
            # Always tag latest release as 'latest'
            - latest

      # Build and push the Docker image
      # The Dockerfile's multi-stage build compiles TypeScript internally
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job: create-release-artifacts
  # Purpose: Create distributable archives and deployment documentation
  # Dependencies: Runs after build-and-push completes successfully
  # 
  # NestJS-Specific Changes:
  # - Added TypeScript build step (npm run build) before tests
  # - Test command uses test:cov (NestJS standard script name)
  # - Archive excludes *.tsbuildinfo TypeScript compiler output files
  # - Production deployment uses npm run start:prod (runs compiled dist/main.js)
  # ---------------------------------------------------------------------------
  create-release-artifacts:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js 18.x with npm caching for faster builds
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
          # Cache based on backend package-lock.json for dependency consistency
          cache-dependency-path: src/backend/package-lock.json

      # Install dependencies using npm ci for reproducible builds
      - name: Install dependencies
        working-directory: src/backend
        run: npm ci

      # ------------------------------------------------------------
      # NESTJS BUILD STEP (NEW)
      # Compile TypeScript source files to JavaScript in dist/ folder
      # This is required before running tests and creating the archive
      # The dist/ folder contains the production-ready compiled code
      # ------------------------------------------------------------
      - name: Build TypeScript
        working-directory: src/backend
        run: npm run build

      # ------------------------------------------------------------
      # TEST STEP (UPDATED)
      # Run tests with coverage using NestJS standard script name
      # Changed from: npm run test:coverage (old Node.js script)
      # Changed to: npm run test:cov (NestJS standard naming convention)
      # ------------------------------------------------------------
      - name: Run tests with coverage
        working-directory: src/backend
        run: npm run test:cov

      # ------------------------------------------------------------
      # ARCHIVE CREATION STEP (UPDATED)
      # Create source archive including compiled dist/ folder
      # Excludes:
      #   - node_modules: Users will run npm ci to install dependencies
      #   - coverage: Test coverage reports not needed in release
      #   - *.tsbuildinfo: TypeScript incremental build cache files
      # Includes:
      #   - src/: TypeScript source files
      #   - dist/: Compiled JavaScript (for non-Docker deployments)
      # ------------------------------------------------------------
      - name: Create source archive
        run: tar -czf nodejs-hello-world-${{ github.event.release.tag_name }}.tar.gz --exclude=node_modules --exclude=coverage --exclude=*.tsbuildinfo src/backend

      # Upload the source archive as a release asset
      - name: Upload source archive to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./nodejs-hello-world-${{ github.event.release.tag_name }}.tar.gz
          asset_name: nodejs-hello-world-${{ github.event.release.tag_name }}.tar.gz
          asset_content_type: application/gzip

      # ------------------------------------------------------------
      # DEPLOYMENT INSTRUCTIONS (UPDATED)
      # Generate markdown documentation for users deploying the release
      # 
      # Manual Installation changes for NestJS:
      #   - npm ci --omit=dev: Modern replacement for npm install --production
      #     (installs only production dependencies, not devDependencies)
      #   - npm run start:prod: Runs the compiled NestJS application
      #     (executes 'node dist/main' - the compiled entry point)
      # ------------------------------------------------------------
      - name: Generate deployment instructions
        run: echo "# Deployment Instructions\n\n## Docker\n\n```bash\ndocker pull ghcr.io/${{ github.repository_owner }}/nodejs-hello-world:${{ github.event.release.tag_name }}\ndocker run -p 3000:3000 ghcr.io/${{ github.repository_owner }}/nodejs-hello-world:${{ github.event.release.tag_name }}\n```\n\n## Manual Installation\n\n```bash\ntar -xzf nodejs-hello-world-${{ github.event.release.tag_name }}.tar.gz\ncd src/backend\nnpm ci --omit=dev\nnpm run start:prod\n```" > deployment-instructions.md

      # Upload deployment instructions as a release asset
      - name: Upload deployment instructions to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./deployment-instructions.md
          asset_name: deployment-instructions.md
          asset_content_type: text/markdown

  # ---------------------------------------------------------------------------
  # Job: verify-deployment
  # Purpose: Validate that the released Docker image works correctly
  # Dependencies: Runs after build-and-push completes successfully
  # 
  # This job is unchanged from the original Node.js implementation because:
  # - The NestJS application serves the same /hello endpoint
  # - The response format remains identical ("Hello world")
  # - The health check script tests the same endpoint
  # ---------------------------------------------------------------------------
  verify-deployment:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      # Checkout the repository to access infrastructure scripts
      - name: Checkout code
        uses: actions/checkout@v3

      # Pull and start the released Docker image in detached mode
      - name: Pull and run Docker image
        run: docker run -d -p 3000:3000 --name hello-world-test ghcr.io/${{ github.repository_owner }}/nodejs-hello-world:${{ github.event.release.tag_name }}

      # Wait for the NestJS application to initialize and start listening
      - name: Wait for container to start
        run: sleep 5

      # Execute health check script to verify /hello endpoint responds correctly
      - name: Run health check
        run: bash infrastructure/scripts/health-check.sh

      # Clean up: stop and remove the test container (runs even if health check fails)
      - name: Stop and remove container
        run: docker stop hello-world-test && docker rm hello-world-test
        if: always()

      # Post a success comment on the release when verification passes
      - name: Add comment to release
        uses: actions/github-script@v6
        with:
          script: "github.rest.issues.createComment({\nissue_number: context.issue.number,\nowner: context.repo.owner,\nrepo: context.repo.repo,\nbody: '✅ Deployment verification successful! Docker image is working correctly.'\n})"